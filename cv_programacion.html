<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cv Programación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Climate+Crisis&family=Lato:ital,wght@1,300&family=Sevillana&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Arvo:wght@700&family=Climate+Crisis&family=Lato:ital,wght@1,300&family=Sevillana&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
      <script src="nav.js" defer></script>
  </head>

  <body>
<site-nav></site-nav>

    
    <!-------------------------------------------------------------------------------------------->
    <br>
    <hr class="hr-cv-sup-prog">
    <br>
        <img src="./imgs/cv/cv_programacion.jpg" class="d-block w-50 mx-auto" alt="Curriculum vitae Programación">
    <br>
    <hr class="hr-cv-inf-prog">
    
    <div class="d-grid gap-2 d-md-flex justify-content-center">
      
      <button type="button" class="btn btn-verde-fluor btn-ver" data-bs-toggle="modal" data-bs-target="#staticBackdropCvProg" >
        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye" width="35" height="35" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
          <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
        </svg>
          Ver
      </button>

      <div class="modal fade" id="staticBackdropCvProg" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabelCvProg" aria-hidden="true">
          <div class="modal-dialog modal-xl">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Curriculum vitae - Programación</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <img src="./imgs/cv/cv_programacion.jpg" class="card-img-top" alt="Certificado">
              </div>
            </div>
          </div>
        </div>
      
      <button class="btn btn-verde-fluor btn-descargar" type="button" id="btnDescargar">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-download" width="30" height="30" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
          <path d="M7 11l5 5l5 -5" />
          <path d="M12 4l0 12" />
        </svg>
        Descargar
      </button>
    </div>
    <br>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script>
        document.getElementById('btnDescargar').addEventListener('click', function() {
          // Obtener la URL de la imagen
          var imagenURL = './imgs/cv/cv_programacion.jpg';
    
          // Crear un enlace temporal
          var link = document.createElement('a');
          link.href = imagenURL;
    
          // Especificar el nombre de archivo para la descarga
          link.download = './imgs/cv/cv_programacion.jpg';
    
          // Hacer clic en el enlace para iniciar la descarga
          link.click();
        });
      </script>
  </body>
</html>
